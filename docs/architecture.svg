<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="800" viewBox="0 0 1040 800" role="img" aria-labelledby="title desc">
<title id="title">ondio architecture — detailed compact layers</title><desc id="desc">The URI-first dispatcher resolves storage through the registry and delegates format operations to FLAC and Parquet helpers. The backends share a byte and file protocol across S3, GCS, HTTP and local storage. create writes only if absent on S3 and local disk. locate resolves a URI to its store and path without storage I/O.</desc>
