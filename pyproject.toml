[project]
dependencies = [
    "boto3>=1.42,<2",
    "numpy",
    # libsndfile ships inside the wheel (all platforms from 0.12; 0.12.0
    # could fail to find it), so no system audio tools are needed
    "soundfile>=0.12.1",
]
name = "ondio"
description = "Uniform IO of audio data and bioacoustic model results across S3, GCS, HTTP, and local filesystems"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE.md"]
authors = [{ name = "Michael Catchen", email = "mdcatchen@gmail.com" }]
requires-python = ">= 3.11"
version = "0.6.0"

[project.urls]
Documentation = "https://schmidtdse.github.io/ondio/"
Changelog = "https://schmidtdse.github.io/ondio/changelog/"
Source = "https://github.com/SchmidtDSE/ondio"

[project.optional-dependencies]
gcs = ["google-cloud-storage>=3"]
parquet = ["pyarrow"]
http = ["requests"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

# keep local tooling state (pixi lockfile, claude settings) out of the sdist
[tool.hatch.build.targets.sdist]
exclude = [".claude", "pixi.lock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: hits real cloud services",
    "slow: long-running",
]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64", "osx-64", "linux-aarch64"]
# canister-worm-protection
exclude-newer = "2026-03-12"

[tool.pixi.pypi-dependencies]
ondio = { path = ".", editable = true }
# canister-worm-protection: get around exclude-newer
cocina = { git = "https://github.com/SchmidtDSE/cocina", rev = "81ba904aa16a31eb275ee6c89ce6eeb3313a22ca" }

# Environments
[tool.pixi.environments]
default = { features = ["http"] }
test = { features = ["test"] }
# no-default-feature: building an sdist/wheel needs no editable install, and
# skipping it keeps the env minimal
build = { features = ["build"], no-default-feature = true }
# no-default-feature: the API pages are read from source, so the docs need no install
docs = { features = ["docs"], no-default-feature = true }

[tool.pixi.feature.test.dependencies]
pytest = "*"
pytest-cov = "*"
moto = "*"
hypothesis = "*"
numpy = "*"
requests-mock = "*"
requests = "*"
google-cloud-storage = "*"
pyarrow = "*"

# --no-isolation: use the conda-provided hatchling instead of letting
# python-build pip-install a backend at build time, so the exclude-newer
# pin above covers the build toolchain too
[tool.pixi.feature.build.dependencies]
python = "3.11.*"
python-build = "*"
hatchling = "*"
twine = "*"

[tool.pixi.feature.build.tasks]
build = { cmd = "rm -rf dist && python -m build --no-isolation", description = "Build the sdist and wheel into a clean dist/" }
check-dist = { cmd = "twine check dist/*", description = "Validate the built artifacts' metadata before upload" }
publish = { cmd = "twine upload dist/*", depends-on = ["build", "check-dist"], description = "Build, check, then upload to PyPI" }

# autorefs, which the docstrings' [text][ondio.x] links need, arrived in zensical 0.0.22
[tool.pixi.feature.docs.dependencies]
python = "3.11.*"
zensical = ">=0.0.22"
mkdocstrings-python = "*"

[tool.pixi.feature.docs.tasks]
docs-diagram = { cmd = "python docs/make_dark_diagram.py", description = "Write the dark-mode docs diagrams from the light ones" }
docs = { cmd = "zensical serve", depends-on = ["docs-diagram"], description = "Preview the docs site with live reload" }
docs-build = { cmd = "rm -rf site && zensical build", depends-on = ["docs-diagram"], description = "Build the docs into a clean site/" }

[tool.pixi.feature.test.tasks]
test = { cmd = "pytest", description = "Run the whole suite (unit, integration, slow, doctests)" }
test-unit = { cmd = "pytest tests/unit -m 'not integration and not slow'", description = "Run the fast unit tests only — the default inner-loop check" }
test-doctest = { cmd = "pytest --doctest-modules --import-mode=importlib ondio", description = "Run the docstring examples in ondio/ as tests" }
