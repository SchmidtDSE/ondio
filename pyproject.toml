[project]
dependencies = [
    "boto3>=1.42,<2",
    "numpy",
    "pydub",
    # backport of stdlib audioop, removed in Python 3.13; earlier versions ship it
    "audioop-lts; python_version >= '3.13'",
]
name = "ondio"
readme = "README.md"
requires-python = ">= 3.11"
version = "0.1.0"

[project.optional-dependencies]
gcs = ["google-cloud-storage"]
parquet = ["pyarrow"]
http = ["requests"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: hits real cloud services",
    "slow: long-running",
]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64", "osx-64", "linux-aarch64"]
# canister-worm-protection
exclude-newer = "2026-03-12"

[tool.pixi.pypi-dependencies]
ondio = { path = ".", editable = true }
# canister-worm-protection: get around exclude-newer
cocina = { git = "https://github.com/SchmidtDSE/cocina", rev = "81ba904aa16a31eb275ee6c89ce6eeb3313a22ca" }

# Environments
[tool.pixi.environments]
default = { features = ["audio", "http"] }
test = { features = ["test", "audio"] }

# pydub shells out to the ffmpeg CLI; pip can't provide the binary, conda can.
[tool.pixi.feature.audio.dependencies]
ffmpeg = "*"

[tool.pixi.feature.test.dependencies]
pytest = "*"
pytest-cov = "*"
moto = "*"
hypothesis = "*"
numpy = "*"
requests-mock = "*"
requests = "*"
google-cloud-storage = "*"
pyarrow = "*"

[tool.pixi.feature.test.pypi-dependencies]
soundfile = "*"

[tool.pixi.feature.test.tasks]
test = "pytest"
test-unit = "pytest tests/unit -m 'not integration and not slow'"
test-doctest = "pytest --doctest-modules ondio"
